<mat-card class="cardWithShadow">
  <mat-card-content>
    <div class="flex items-center justify-end">
      <button mat-icon-button (click)="cargar()" matTooltip="Actualizar listado">
        <mat-icon>refresh</mat-icon>
      </button>

      <button mat-flat-button color="primary" [disabled]="!hayNoLeidas()" (click)="marcarTodasLeidas()">
        Marcar todas como leídas
      </button>
    </div>
  </mat-card-content>
</mat-card>

<mat-card class="cardWithShadow">
  <mat-card-content>
    <div class="relative overflow-auto max-h-[70vh]">
      <table mat-table [dataSource]="notificaciones()" class="min-w-full">

        <ng-container matColumnDef="estado">
          <th mat-header-cell *matHeaderCellDef class="text-base font-semibold">Estado</th>
          <td mat-cell *matCellDef="let notificacion" class="whitespace-nowrap">
            <span
              class="px-3 py-1 rounded-full text-xs font-semibold"
              [ngClass]="notificacion.leida ? 'bg-light-secondary text-secondary' : 'bg-light-primary text-primary'"
            >
              {{ notificacion.leida ? 'Leída' : 'No leída' }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="titulo">
          <th mat-header-cell *matHeaderCellDef class="text-base font-semibold">Título</th>
          <td mat-cell *matCellDef="let notificacion" class="whitespace-nowrap">
            <span [class.font-semibold]="!notificacion.leida">{{ notificacion.titulo }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="mensaje">
          <th mat-header-cell *matHeaderCellDef class="text-base font-semibold">Mensaje</th>
          <td mat-cell *matCellDef="let notificacion">{{ notificacion.mensaje }}</td>
        </ng-container>

        <ng-container matColumnDef="fecha">
          <th mat-header-cell *matHeaderCellDef class="text-base font-semibold">Fecha</th>
          <td mat-cell *matCellDef="let notificacion" class="text-sm whitespace-nowrap">
            <span [matTooltip]="getFechaCompleta(notificacion.fechaCreacion)">
              {{ notificacion.fechaCreacion | date: "short" }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef class="text-base font-semibold">Acciones</th>
          <td mat-cell *matCellDef="let notificacion" class="action-link whitespace-nowrap">
            @if (!notificacion.leida) {
              <a (click)="marcarLeida(notificacion)" class="me-2.5 cursor-pointer">
                <mat-icon class="icon-20 text-primary!" matTooltip="Marcar como leída">check</mat-icon>
              </a>
            }
            <a (click)="eliminar(notificacion)" class="cursor-pointer">
              <mat-icon class="icon-20 text-red-600!" matTooltip="Eliminar notificación">delete</mat-icon>
            </a>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns" class="interactive-row"></tr>

        <tr *matNoDataRow>
          <td [attr.colspan]="displayedColumns.length" class="text-center text-sm text-gray-500 py-6">
            No tienes notificaciones.
          </td>
        </tr>
      </table>
    </div>

    <mat-paginator
      [pageSize]="pageSize()"
      [length]="totalElements()"
      [pageIndex]="pageIndex()"
      [pageSizeOptions]="[10, 20, 50, 100]"
      showFirstLastButtons
      (page)="cambiarPagina($event)"
    ></mat-paginator>
  </mat-card-content>
</mat-card>
