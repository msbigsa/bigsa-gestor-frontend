<mat-card class="cardWithShadow">
  <mat-card-content>
    <div class="flex items-start justify-between gap-4 py-2">
      <div>
        <div class="text-base font-semibold">Notificaciones</div>
        <div class="text-sm text-gray-500">
          Activa o desactiva el sistema de notificaciones para todos los usuarios de Gestor.
        </div>
      </div>

      <mat-slide-toggle
        [checked]="usaNotificacion()"
        [disabled]="guardando()"
        (change)="onUsaNotificacionChange($event.checked)"
      ></mat-slide-toggle>
    </div>
  </mat-card-content>
</mat-card>
