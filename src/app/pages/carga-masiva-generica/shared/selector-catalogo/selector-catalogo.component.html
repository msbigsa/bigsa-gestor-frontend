<mat-form-field appearance="outline" class="w-full hide-hint">
  <input
    matInput
    #trigger="matAutocompleteTrigger"
    [placeholder]="placeholder()"
    [formControl]="texto"
    [matAutocomplete]="auto"
    (focus)="seleccionarTexto($event)"
    (blur)="onTouched()"
  />
  @if (seleccionada()) {
    <button mat-icon-button matSuffix type="button" (click)="limpiar()" matTooltip="Limpiar selección">
      <mat-icon>close</mat-icon>
    </button>
  } @else {
    <mat-icon matSuffix class="autocomplete-caret" [class.autocomplete-caret--open]="trigger.panelOpen">arrow_drop_down</mat-icon>
  }
  <mat-autocomplete #auto="matAutocomplete" [displayWith]="display" (optionSelected)="onSeleccion($event)">
    @for (opcion of filtradas(); track opcion.codigo) {
      <mat-option [value]="opcion">{{ etiqueta(opcion) }}</mat-option>
    }
  </mat-autocomplete>
</mat-form-field>
