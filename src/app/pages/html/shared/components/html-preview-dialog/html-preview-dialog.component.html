<h2 mat-dialog-title>Previsualización Documento como HTML (Versión {{ version }})</h2>

<mat-dialog-content>

  <iframe
    #iframe
    class="preview-frame">
  </iframe>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button 
    mat-button 
    (click)="cerrar()">
    Cerrar
  </button>

</mat-dialog-actions>
